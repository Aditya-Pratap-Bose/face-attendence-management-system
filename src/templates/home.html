<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Face Attendance - Home</title>
  <style>
    :root{--bg:#0b0f12;--panel:#081018;--neon:#00f6ff;--accent:#9b59b6;--muted:#9aa4ab;--glass: rgba(255,255,255,0.03);font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial}
    html,body{height:100%;margin:0;background:radial-gradient(circle at 10% 10%, #071018 0%, var(--bg) 40%);color:#e6eef3}
    .wrap{max-width:900px;margin:48px auto;padding:28px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 6px 30px rgba(0,0,0,0.6),0 0 40px var(--neon) inset;border:1px solid rgba(255,255,255,0.04);text-align:center}
    .logo{height:120px;margin:0 auto 12px;border-radius:10px;background:linear-gradient(135deg,#071824,#0b1730);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--neon);box-shadow:0 0 24px rgba(0,246,255,0.12)}
    .nav{display:flex;gap:12px;justify-content:center;margin-top:12px}
    .nav a{padding:12px 18px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--neon);text-decoration:none;font-weight:600}
    p{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="/static/logo.jpg" alt="College Logo" style="height:120px;width:auto;object-fit:contain;border-radius:8px;"/></div>
    <h1>Face Recognition Attendance</h1>
    <p class="muted">Use the links below to enroll students, take attendance, or download attendance records.</p>

    <div class="nav">
      <a href="/enroll">Enroll Student</a>
      <a href="/attendance">Take Attendance</a>
      <a href="/download">Download Attendance</a>
      <a href="/students">Manage Students</a>
    </div>
  </div>
</body>
</html>
