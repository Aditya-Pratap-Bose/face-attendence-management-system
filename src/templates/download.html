<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Download/View Attendance - Face Attendance</title>
  <style>
    :root{--bg:#0b0f12;--panel:#081018;--neon:#00f6ff;--accent:#9b59b6;--muted:#9aa4ab;--glass: rgba(255,255,255,0.03);font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial}
    html,body{height:100%;margin:0;background:radial-gradient(circle at 10% 10%, #071018 0%, var(--bg) 40%);color:#e6eef3}
    .container{max-width:980px;margin:36px auto;padding:28px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 6px 30px rgba(0,0,0,0.6),0 0 40px var(--neon) inset;border:1px solid rgba(255,255,255,0.04)}
    .header{display:flex;flex-direction:column;align-items:center;gap:16px}
    .logo{width:120px;height:120px;border-radius:8px;background:linear-gradient(135deg,#071824,#0b1730);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--neon);box-shadow:0 0 24px rgba(0,246,255,0.12)}
    .nav{display:flex;gap:12px}
    .nav a{padding:10px 16px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--neon);text-decoration:none}
    .panel{background:var(--panel);padding:18px;border-radius:10px;box-shadow:0 6px 40px rgba(0,0,0,0.6),0 0 24px rgba(155,89,182,0.04) inset;border:1px solid rgba(255,255,255,0.03);margin-top:18px}
    .controls{display:flex;gap:10px;align-items:center}
    input[type=date]{padding:8px;border-radius:8px;background:var(--glass);border:1px solid rgba(255,255,255,0.03);color:#eaf6ff}
    button{padding:10px 14px;border-radius:8px;background:linear-gradient(90deg,var(--neon),var(--accent));color:#011;border:none;cursor:pointer}
    .table-wrap{max-height:420px;overflow:auto;margin-top:12px;border-radius:8px;background:rgba(255,255,255,0.02);padding:8px}
    table{width:100%;border-collapse:collapse;color:#eaf6ff}
    th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.03);text-align:left}
    th{position:sticky;top:0;background:rgba(0,0,0,0.25)}
    footer{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><img src="/static/logo.jpg" alt="College Logo" style="max-width:120px;max-height:120px;object-fit:contain;border-radius:6px;"/></div>
      <div class="nav">
        <a href="/enroll">Enroll Student</a>
        <a href="/attendance">Take Attendance</a>
        <a href="/download">Download Attendance</a>
        <a href="/students">Manage Students</a>
      </div>
    </div>

    <div class="panel">
      <h2>View / Download Attendance</h2>
      <p style="color:var(--muted)">Choose a date to view or download the attendance CSV.</p>

      <div class="controls">
        <label for="date">Date:</label>
        <input type="date" id="date" value="{{ today }}" />
        <button id="view">View</button>
        <button id="download">Download</button>
        <span id="msg" style="color:var(--muted);margin-left:8px"></span>
      </div>

      <div class="table-wrap" id="tableWrap" style="display:none">
        <table id="attTable">
          <thead><tr><th>Roll No</th><th>Name</th><th>Class</th><th>Date</th><th>Time</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <footer>Face Recognition Attendance System · Simple dark neon UI</footer>
  </div>

  <script>
  const viewBtn = document.getElementById('view');
  const downloadBtn = document.getElementById('download');
  const dateInput = document.getElementById('date');
  const msg = document.getElementById('msg');
  const tableWrap = document.getElementById('tableWrap');
  const tbody = document.querySelector('#attTable tbody');

  function makeCell(text) {
    const td = document.createElement('td');
    td.textContent = text ?? '';
    return td;
  }

  viewBtn.addEventListener('click', async () => {
    const d = dateInput.value;
    if (!d) { msg.textContent = 'Please pick a date'; return; }
    msg.textContent = '';
    try {
      const res = await fetch(`/download/api/view?date=${encodeURIComponent(d)}`);
      const data = await res.json();
      if (data.error) { msg.textContent = data.error; return; }

      tbody.innerHTML = '';
      if (!data.rows || data.rows.length === 0) {
        tableWrap.style.display = 'none';
        msg.textContent = 'No records for this date';
        return;
      }

      data.rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.appendChild(makeCell(r.rollno));
        tr.appendChild(makeCell(r.name));
        tr.appendChild(makeCell(r.class));
        tr.appendChild(makeCell(r.date));
        tr.appendChild(makeCell(r.time));
        tbody.appendChild(tr);
      });

      tableWrap.style.display = 'block';
    } catch (e) {
      console.error(e);
      msg.textContent = 'Failed to fetch';
    }
  });

  downloadBtn.addEventListener('click', () => {
    const d = dateInput.value;
    if (!d) { msg.textContent = 'Please pick a date'; return; }
    msg.textContent = 'Preparing download...';
    const url = `/download/api/download?date=${encodeURIComponent(d)}`;
    window.location.href = url;
    setTimeout(() => { msg.textContent = ''; }, 2000);
  });
</script>
</body>
</html>
